services:
  db:
    image: postgres:17-alpine
    container_name: medikiosk-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: medikiosk
      POSTGRES_PASSWORD: medikiosk
      POSTGRES_DB: medikiosk
    ports:
      - '5432:5432'
    volumes:
      - medikiosk_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U medikiosk -d medikiosk']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  medikiosk_pgdata:
